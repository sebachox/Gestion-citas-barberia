<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reserva tu Cita - Barbería XYZ</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #0f0f0f, #1a1a1a);
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background-color: #222;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
      margin: 20px 0;
    }

    header h1 {
      text-align: center;
      font-weight: 700;
      color: #FFD700;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #ccc;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #333;
      color: #fff;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    input:focus,
    select:focus {
      outline: none;
      background-color: #444;
      box-shadow: 0 0 5px #FFD700;
    }

    button#submitBtn {
      width: 100%;
      padding: 14px;
      background-color: #FFD700;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      color: #000;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button#submitBtn:hover {
      background-color: #e6c200;
    }

    #mensaje {
      margin-top: 20px;
      text-align: center;
      font-weight: 500;
    }

    /* Estilos para el footer y modal del equipo */
    .dev-footer {
      text-align: center;
      padding: 20px;
      width: 100%;
      max-width: 500px;
    }
    
    #showTeamBtn {
      background: transparent;
      border: 1px solid #FFD700;
      color: #FFD700;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }
    
    #showTeamBtn:hover {
      background: rgba(255, 215, 0, 0.1);
    }
    
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
    }
    
    .modal-content {
      background-color: #222;
      margin: 10% auto;
      padding: 30px;
      border: 1px solid #FFD700;
      width: 80%;
      max-width: 600px;
      border-radius: 10px;
      position: relative;
    }
    
    .modal-content h2 {
      color: #FFD700;
      text-align: center;
    }
    
    .subtitle {
      text-align: center;
      color: #ccc;
      margin-bottom: 30px;
    }
    
    .team-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    
    .team-member {
      background: #333;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }
    
    .team-member h3 {
      margin-top: 0;
      color: #fff;
    }
    
    .team-member a {
      color: #FFD700;
      text-decoration: none;
    }
    
    .team-member a:hover {
      text-decoration: underline;
    }
    
    .close {
      position: absolute;
      right: 20px;
      top: 10px;
      color: #aaa;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
    
    .close:hover {
      color: #fff;
    }

    @media (max-width: 600px) {
      .team-grid {
        grid-template-columns: 1fr;
      }
      
      .modal-content {
        margin: 20% auto;
        width: 90%;
      }
    }
  </style>
</head>
<body>
    <div class="container">
      <header>
        <h1>Reserva tu cita</h1>
      </header>

      <main>
        <form id="reservaForm">
          <div class="form-group">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" required />
          </div>

          <div class="form-group">
            <label for="cedula">Cédula:</label>
            <input id="cedula" type="text" inputmode="numeric" title="Debe tener 8 o 10 dígitos numéricos" required />
          </div>

          <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <input id="telefono" type="tel" inputmode="numeric" pattern="\d{10}" title="Debe tener exactamente 10 dígitos"required />
          </div>

          <div class="form-group">
            <label for="barbero">Barbero:</label>
            <select id="barbero" required>
              <option value="">Selecciona un barbero</option>
            </select>
          </div>

          <div class="form-group">
            <label for="servicio">Servicio:</label>
            <select id="servicio" required>
              <option value="">Selecciona un servicio</option>
            </select>
          </div>

          <div class="form-group">
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" required />
          </div>

          <div class="form-group">
            <label for="hora">Hora:</label>
            <select id="hora" required disabled>
              <option value="">Primero selecciona barbero y fecha</option>
            </select>
          </div>

          <button type="submit" id="submitBtn">Reservar Cita</button>
        </form>

        <div id="mensaje"></div>
      </main>
    </div>

    <footer class="dev-footer">
      <button id="showTeamBtn">Acerca del equipo de desarrollo</button>
    </footer>
    
    <div id="teamModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Equipo de Desarrollo</h2>
        <p class="subtitle">Estudiantes de Ingeniería de Sistemas</p>
        
        <div class="team-grid">
          <div class="team-member">
            <h3>Sebastián Ordoñez</h3>
            <p><a href="mailto:sebastiandavidordbol@gmail.com">sebastiandavidordbol@gmail.com</a></p>
          </div>
          
          <div class="team-member">
            <h3>Andrés Trujillo</h3>
            <p><a href="mailto:andrestrujillovillota@gmail.com">andrestrujillovillota@gmail.com</a></p>
          </div>
          
          <div class="team-member">
            <h3>Víctor Erazo</h3>
            <p><a href="mailto:victorerazoburbano@gmail.com">victorerazoburbano@gmail.com</a></p>
          </div>
          
          <div class="team-member">
            <h3>Dario Narvaez</h3>
            <p><a href="mailto:darionarvaez66@gmail.com">darionarvaez66@gmail.com</a></p>
          </div>
        </div>
      </div>
    </div>

  <script>
    // Establecer fecha mínima para el campo de fecha (mañana)
    const fechaInput = document.getElementById('fecha');
    const hoy = new Date();
    hoy.setDate(hoy.getDate() + 1); // Sumar un día

    const yyyy = hoy.getFullYear();
    const mm = String(hoy.getMonth() + 1).padStart(2, '0');
    const dd = String(hoy.getDate()).padStart(2, '0');
    const minFecha = `${yyyy}-${mm}-${dd}`;

    fechaInput.min = minFecha;

    // Mostrar/ocultar modal del equipo
    document.getElementById('showTeamBtn').addEventListener('click', function() {
      document.getElementById('teamModal').style.display = 'block';
    });
    
    document.querySelector('#teamModal .close').addEventListener('click', function() {
      document.getElementById('teamModal').style.display = 'none';
    });
    
    window.addEventListener('click', function(event) {
      if (event.target === document.getElementById('teamModal')) {
        document.getElementById('teamModal').style.display = 'none';
      }
    });
  </script>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/main.js"></script>

  <script>
    // Convierte entradas de texto en mayúsculas automáticamente
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('input[type="text"], textarea').forEach(elemento => {
        elemento.addEventListener('input', () => {
          elemento.value = elemento.value.toUpperCase();
        });
      });
    });
  </script>
</body>
</html>
